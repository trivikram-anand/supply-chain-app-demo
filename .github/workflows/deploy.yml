name: Deploy to Azure

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: scmanalytics123.azurecr.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push Backend
        run: |
          cd backend
          docker build -t scmanalytics123.azurecr.io/supply-chain-backend:${{ github.sha }} .
          docker push scmanalytics123.azurecr.io/supply-chain-backend:${{ github.sha }}
          az containerapp create --name scm-backend --resource-group SupplyChainRG2 --environment scm-env --image scmanalytics123.azurecr.io/supply-chain-backend:${{ github.sha }} --target-port 8000 --ingress external --registry-server scmanalytics123.azurecr.io

      - name: Build and Push Frontend
        run: |
          cd frontend
          docker build -t scmanalytics123.azurecr.io/supply-chain-frontend:${{ github.sha }} .
          docker push scmanalytics123.azurecr.io/supply-chain-frontend:${{ github.sha }}
          az containerapp create --name scm-frontend --resource-group SupplyChainRG2 --environment scm-env --image scmanalytics123.azurecr.io/supply-chain-frontend:${{ github.sha }} --target-port 3000 --ingress external --registry-server scmanalytics123.azurecr.io